events {
    worker_connections 1024;
}

http {
    # Her IP adresi için limit tanımlaması (saniyede 50 istek)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

    upstream springboot {
        # Host networking kullandığımızı varsayarsak (veya docker'da değilse)
        # Nginx konteyner içinden host'taki 8080'e ulaşmak için host.docker.internal (veya 172.17.0.1) kullanılabilir.
        # Spring Boot docker-compose'da çalışmıyor, kullanıcının IDE'sinde çalışıyor. 
        # Windows/Mac docker için:
        server host.docker.internal:8080;
    }

    server {
        listen 80;

        location /api/ {
            # Limiti uygula. Anlık patlamalar için 100 isteğe kadar tölerans tanı (burst).
            limit_req zone=api_limit burst=100 nodelay;
            
            proxy_pass http://springboot;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
